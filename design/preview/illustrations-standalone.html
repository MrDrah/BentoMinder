<style>
body{margin:0;font:14px/1.6 var(--font-body);background:var(--surface-1);color:var(--ink-1)}
header{padding:16px;max-width:900px;margin:auto}
h1{font:700 22px var(--font-display);margin:0 0 4px}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-ui);background:var(--surface-2);color:var(--ink-1)}
.themes{display:grid;grid-template-columns:1fr}
@media(min-width:900px){.themes{grid-template-columns:1fr 1fr}}
.theme{background:var(--surface-1);color:var(--ink-1);padding:16px}
.theme h2{font:700 16px var(--font-display);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{background:var(--surface-2);border:1px solid var(--line-1);border-radius:12px;overflow:hidden;margin:0}
.tile figcaption{padding:4px 8px;font-size:12px;color:var(--ink-2)}
.art{background:var(--surface-3);display:block;height:120px}
.art svg{display:block;width:100%;height:100%}
.sizes{display:flex;gap:12px;align-items:flex-end;margin-top:12px}
.sizes .art{border-radius:8px;overflow:hidden}
/* ---- illustration rules (production: same classes, scoped under .dish) ---- */
.dish *{stroke-linejoin:round;stroke-linecap:round}
.dish .l{stroke:var(--illus-line);stroke-width:2}
.dish .nf{fill:none}
.dish .bw{fill:var(--illus-blob-warm)}.dish .bc{fill:var(--illus-blob-cool)}
.dish .rice{fill:var(--illus-rice)}.dish .egg{fill:var(--illus-egg)}.dish .grn{fill:var(--illus-green)}
.dish .brn{fill:var(--illus-brown)}.dish .nori{fill:var(--illus-nori)}.dish .pnk{fill:var(--illus-pink)}
.dish .red{fill:var(--illus-red)}.dish .org{fill:var(--illus-orange)}.dish .tan{fill:var(--illus-tan)}
.dish .blu{fill:var(--illus-blue)}.dish .ware{fill:var(--surface-2)}
.dish .stm{stroke:var(--illus-steam);stroke-width:2.5;fill:none}
.dish .spk{fill:var(--illus-steam)}
.dish .a1,.dish .a2{transform-box:fill-box;animation-play-state:paused}
.live .dish .a1,.live .dish .a2{animation-play-state:running}
@media (prefers-reduced-motion:no-preference){
 .dish .steam1{opacity:0;animation:steam 3.6s ease-in-out infinite}
 .dish .steam2{opacity:0;animation:steam 3.6s ease-in-out 1.8s infinite}
 .dish .wob{transform-origin:50% 100%;animation:wob 3.2s ease-in-out infinite}
 .dish .squash{transform-origin:50% 100%;animation:squash 3s ease-in-out infinite}
 .dish .sway{transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
 .dish .tail{transform-origin:0% 50%;animation:wob 3.4s ease-in-out infinite}
 .dish .lift{animation:lift 3.6s ease-in-out infinite}
 .dish .twk1{transform-origin:50% 50%;opacity:0;animation:twk 2.4s ease-in-out infinite}
 .dish .twk2{transform-origin:50% 50%;opacity:0;animation:twk 2.4s ease-in-out 1.2s infinite}
 .dish .puff{transform-origin:50% 100%;animation:puff 3.2s ease-in-out infinite}
 .dish .bob{transform-origin:50% 100%;animation:bob 3.6s ease-in-out infinite}
}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-7px)}}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes squash{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.96)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes twk{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes puff{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
